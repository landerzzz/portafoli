<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <title>Reproductor de Pòdcasts</title>
<body>
    <h1>Ultims episodis dels meus Pòdcasts</h1>
    <figure>
        <img src="logo-tecnologia.jpg" alt="Logo Tecnologia" width="200">
        <figcaption>Pòdcast de Tecnologia - Episodi 101</figcaption>
        <audio controls>
            <source src="tecnologia.mp3" type="audio/mp3">
            <source src="tecnologia.ogg" type="audio/ogg">
            <p>El seu navegador no suporta el format de l'àudio, prem <a href="tecnologia.mp3">aquí</a> per descarregarlo.</p>
        </audio>
    </figure>
    <figure>
        <img src="logo-historia.jpg" alt="Logo Historia" width="200">
        <figcaption>Pòdcast d'Història - La Caiguda de Roma</figcaption>
        <audio controls>
            <source src="historia.mp3" type="audio/mp3">
            <source src="historia.wav" type="audio/wav">
            <p>El seu navegador no suporta el format de l'àudio, prem <a href="historia.mp3">aquí</a> per descarregarlo.</p>
        </audio>
    </figure>
    <figure>
        <img src="logo-musica.jpg" alt="Logo Musica" width="200">
        <figcaption>Música Ambiental - Sessió Relax</figcaption>
        <audio controls loop>
            <source src="musica.mp3" type="audio/mp3">
            <source src="musica.aac" type="audio/aac">
            <p>El seu navegador no suporta el format de l'àudio, prem <a href="musica.mp3">aquí</a> per descarregalo.</p>
        </audio>
    </figure>
</body>
</html>
